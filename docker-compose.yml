services:
  backend:
    build:
      context: .
      dockerfile: .docker/backend/Dockerfile
    container_name: review-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://localhost
      AI_SERVICE_URL: http://ai-model:5000
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      OWNER_EMAIL: ${OWNER_EMAIL}
    ports:
      - "8000:8000"
    depends_on:
      - ai-model
    volumes:
      - ./backend:/var/www/backend
      - ./backend/storage:/var/www/backend/storage
    networks:
      - review-network

  ai-model:
    build:
      context: .
      dockerfile: .docker/ai-model/Dockerfile
    container_name: review-ai
    restart: unless-stopped
    environment:
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL}
      FLASK_PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./ai-model:/var/www/ai-model
    networks:
      - review-network

  nginx:
    build:
      context: .
      dockerfile: .docker/nginx/Dockerfile
    container_name: review-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
      - ai-model
    volumes:
      - ./frontend:/var/www/frontend
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - review-network

networks:
  review-network:
    driver: bridge