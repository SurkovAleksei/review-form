<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>

    <div id="app">
        <div class="container">
            <h1>Обратная связь</h1>
            <p class="subtitle">Заполните форму и я отвечу вам</p>

            <form @submit.prevent="submitForm" v-if="!submitted">

                <div class="form-group">
                    <label>Имя <span class="required">*</span></label>
                    <input v-model="form.name" @blur="validateField('name')" placeholder="Введите имя" :class="{ error: errors.name }">
                    <div class="error-text">{{ errors.name }}</div>
                </div>

                <div class="form-group">
                    <label>Email <span class="required">*</span></label>
                    <input type="email" v-model="form.email" @blur="validateField('email')" placeholder="example@mail.com" :class="{ error: errors.email }">
                    <div class="error-text">{{ errors.email }}</div>
                </div>

                <div class="form-group">
                    <label>Телефон <span class="required">*</span></label>
                    <input v-model="form.phone" @blur="validateField('phone')" placeholder="+7 900 123-45-67" :class="{ error: errors.phone }">
                    <div class="error-text">{{ errors.phone }}</div>
                </div>

                <div class="form-group">
                    <label>Сообщение <span class="required">*</span></label>
                    <textarea v-model="form.comment" @blur="validateField('comment')" placeholder="Опишите ваш запрос" rows="4" :class="{ error: errors.comment }"></textarea>
                    <div class="counter" :class="{ danger: commentLength > 4500 }">
                        {{ commentLength }} / 5000
                    </div>
                    <div class="error-text">{{ errors.comment }}</div>
                </div>

                <button type="submit" class="btn btn-submit" :disabled="loading">
                    <span v-if="!loading">Отправить</span>
                    <span v-else>
                        <span class="spinner"></span> Отправка...
                    </span>
                </button>

                <button type="button" class="btn btn-check" @click="checkServer" :disabled="checking">
                    <span v-if="!checking">Проверить сервер</span>
                    <span v-else>
                        <span class="spinner"></span> Проверка...
                    </span>
                </button>

                <div v-if="serverResult" class="status-check" :class="serverResult.ok ? 'ok' : 'err'">
                    {{ serverResult.msg }}
                </div>

                <div v-if="error" class="error-box">
                    <p>{{ error.message || error }}</p>
                    <div v-if="error.details" class="details">{{ error.details }}</div>
                    <div class="btn-group">
                        <button @click="submitForm" class="btn btn-retry">Повторить</button>
                    </div>
                </div>

            </form>

            <div v-else class="success">
                <h3>Сообщение отправлено</h3>
                <button @click="resetForm" class="btn btn-reset">Отправить еще</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
